<!DOCTYPE html>
<html lang="pl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lab 3 – Ćwiczenie 2: Generator haseł</title>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<main class="container">
			<h1>Generator haseł</h1>

			<div class="formularz">
				<label>
					Minimalna długość hasła:
					<input type="number" id="min" value="8" min="1" />
				</label>
				<label>
					Maksymalna długość hasła:
					<input type="number" id="max" value="16" min="1" />
				</label>
				<label>
					<input type="checkbox" id="wielkie" />
					Wielkie litery
				</label>
				<label>
					<input type="checkbox" id="specjalne" />
					Znaki specjalne
				</label>

				<button id="generuj">Wygeneruj hasło</button>
			</div>

			<p><a href="index.html">Powrót</a></p>
		</main>

		<script src="cwiczenie2.js"></script>
	</body>
</html>
